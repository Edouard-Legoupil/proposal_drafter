[pytest]
# Test discovery - only look in tests/ subdirectory of playwright/
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Test execution
addopts = -v --tb=short

# Prevent pytest from looking outside playwright directory
norecursedirs = backend venv .git __pycache__ *.egg-info

# Custom markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    smoke: marks tests as smoke tests (quick sanity checks)
    regression: marks tests as regression tests
    user_profile: Tests for user profile management
    proposal_creation: Tests for proposal creation and editing
    knowledge_management: Tests for knowledge card management
    template_management: Tests for template management
    review_collaboration: Tests for review and collaboration workflows
    document_sharing: Tests for document sharing functionality
    administrative: Tests for administrative functions
    system_monitoring: Tests for system monitoring and health
    user_registration: Tests related to user registration and authentication
    peer_review: Tests for peer review workflow
    dashboard: Tests for dashboard functionality
    e2e: End-to-end user journey tests
    verification: Tests for coverage verification
    error_handling: Tests for error handling scenarios
    validation: Tests for data validation

# Reporting
console_output_style = classic

# Parallel execution (if needed)
# addopts = -n auto
